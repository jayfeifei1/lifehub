<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>地图找店</title>
  <link rel="stylesheet" href="./css/leaflet/leaflet.css">
  <style type="text/css">
    html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; }
    .header {
      position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 1000;
      background: #fff; display: flex; align-items: center; padding: 0 10px;
      border-bottom: 1px solid #eee;
    }
    .header-back-btn { font-size: 15px; cursor: pointer; color: #333; display: flex; align-items: center; }
    .header-back-btn .arrow { font-size: 22px; margin-right: 2px; line-height: 1; }
    .header-title { flex: 1; text-align: center; font-weight: bold; font-size: 16px; }
    .header-right { width: 60px; }
    /* 类型筛选栏 */
    .type-bar {
      position: fixed; top: 44px; left: 0; right: 0; height: 40px; z-index: 999;
      background: #fff; display: flex; align-items: center; overflow-x: auto;
      border-bottom: 1px solid #eee; padding: 0 6px; white-space: nowrap;
    }
    .type-item {
      flex: 0 0 auto; padding: 4px 12px; margin: 0 3px; border-radius: 14px;
      font-size: 13px; color: #333; background: #f5f5f5; cursor: pointer;
    }
    .type-item.active { background: #F63; color: #fff; }
    #map { position: fixed; top: 84px; bottom: 0; left: 0; right: 0; z-index: 1; }
    .shop-popup { min-width: 150px; }
    .shop-popup img { width: 56px; height: 56px; float: left; margin-right: 8px; border-radius: 4px; object-fit: cover; background: #eee; }
    .shop-popup .name { font-weight: bold; font-size: 14px; margin-bottom: 2px; }
    .shop-popup .addr { color: #999; font-size: 12px; }
    .shop-popup .meta { color: #F63; font-size: 12px; margin-top: 4px; }
    .shop-popup a { color: #409EFF; font-size: 12px; display: block; margin-top: 4px; }

    /* 自定义店铺标记：彩色圆点 + 店铺名 */
    .shop-marker { background: none; border: none; text-align: center; }
    .shop-marker .dot {
      width: 30px; height: 30px; border-radius: 50%; background: #F63; color: #fff;
      text-align: center; line-height: 30px; font-size: 14px; margin: 0 auto;
      border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    .shop-marker .label {
      background: rgba(255,255,255,.92); border-radius: 3px; font-size: 10px; color: #333;
      text-align: center; padding: 0 3px; margin-top: 2px; max-width: 84px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      box-shadow: 0 1px 2px rgba(0,0,0,.15);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-back-btn" onclick="history.back()"><span class="arrow">‹</span>返回</div>
    <div class="header-title">附近商铺</div>
    <div class="header-right"></div>
  </div>
  <div class="type-bar" id="typeBar"></div>
  <div id="map"></div>

  <script src="./js/leaflet/leaflet.js"></script>
  <script src="./js/vue.js"></script>
  <script src="./js/axios.min.js"></script>
  <script src="./js/common.js"></script>
  <script>
    // 地图中心：杭州（演示店铺数据所在城市）
    var CENTER = [30.2741, 120.1551];
    // 高德瓦片（国内加载快、免 key）；如不可用可换 OSM: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    var TILE_URL = 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}';

    var map = L.map('map').setView(CENTER, 12);
    L.tileLayer(TILE_URL, {
      subdomains: ['1', '2', '3', '4'],
      maxZoom: 18,
      attribution: '&copy; 高德地图'
    }).addTo(map);

    var markers = [];
    var types = [];       // 店铺类型列表
    var currentType = 0;  // 0 = 全部
    // 查询中心点：取店铺分布中心（杭州运河商圈），保证 5km 半径覆盖全部演示店铺
    var QUERY_POINT = { x: 120.145, y: 30.32 };

    // 加载类型列表并渲染筛选栏
    function queryTypes() {
      axios.get('/shop-type/list')
        .then(function (resp) {
          types = resp.data || [];
          renderTypeBar();
          loadShops(1);
        })
        .catch(function (err) {
          console.error(err);
          loadShops(1); // 类型加载失败也先显示全部
        });
    }

    function renderTypeBar() {
      var html = '<span class="type-item' + (currentType === 0 ? ' active' : '') + '" onclick="selectType(0)">全部</span>';
      types.forEach(function (t) {
        html += '<span class="type-item' + (currentType === t.id ? ' active' : '') + '" onclick="selectType(' + t.id + ')">' + t.name + '</span>';
      });
      document.getElementById('typeBar').innerHTML = html;
    }

    function selectType(id) {
      if (id === currentType) return;
      currentType = id;
      renderTypeBar();
      clearMarkers();
      loadShops(1);
    }

    function clearMarkers() {
      markers.forEach(function (m) { map.removeLayer(m); });
      markers = [];
    }

    // 分页拉取店铺：全部走 /shop/of/name；指定类型走 GEO 分桶 /shop/of/type
    function loadShops(page) {
      var onData = function (data) {
        if (!data || data.length === 0) {
          fitBounds();
          return;
        }
        data.forEach(addMarker);
        var pageSize = currentType === 0 ? 10 : 8;
        if (data.length >= pageSize) {
          loadShops(page + 1);
        } else {
          fitBounds();
        }
      };
      var onError = function (err) { console.error(err); };

      if (currentType === 0) {
        axios.get('/shop/of/name', { params: { current: page } })
          .then(function (resp) { onData(resp.data); })
          .catch(onError);
      } else {
        axios.get('/shop/of/type', {
          params: { typeId: currentType, current: page, x: QUERY_POINT.x, y: QUERY_POINT.y }
        }).then(function (resp) { onData(resp.data); })
          .catch(onError);
      }
    }

    function addMarker(shop) {
      if (!shop.x || !shop.y) return;
      var img = shop.images ? shop.images.split(',')[0] : '';
      // 自定义标记：彩色圆点（店铺名首字）+ 店铺名（外链图片失败/未加载时也能辨识商家）
      var icon = L.divIcon({
        className: 'shop-marker',
        html: '<div class="dot">' + (shop.name ? shop.name.charAt(0) : '店') + '</div>'
            + '<div class="label">' + (shop.name || '') + '</div>',
        iconSize: [60, 46],
        iconAnchor: [30, 44],
        popupAnchor: [0, -42]
      });
      var popup = '<div class="shop-popup">'
        + (img ? '<img src="' + img + '" onerror="this.style.display=\'none\'" alt="">' : '')
        + '<div class="name">' + shop.name + '</div>'
        + '<div class="addr">' + (shop.address || '') + '</div>'
        + '<div class="meta">￥' + shop.avgPrice + '/人 · ' + (shop.score / 10).toFixed(1) + '分</div>'
        + '<a href="/shop-detail.html?id=' + shop.id + '">查看详情 &raquo;</a>'
        + '</div>';
      var marker = L.marker([shop.y, shop.x], { icon: icon }).addTo(map).bindPopup(popup);
      markers.push(marker);
    }

    function fitBounds() {
      if (markers.length === 0) return;
      var bounds = L.latLngBounds(markers.map(function (m) { return m.getLatLng(); }));
      map.fitBounds(bounds.pad(0.15));
    }

    queryTypes();
  </script>
</body>
</html>
