name: hmdp-local

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hmdp
      TZ: Asia/Shanghai
    volumes:
      - hmdp_mysql_data:/var/lib/mysql
      - ./docker/mysql/hmdp.sql:/docker-entrypoint-initdb.d/01-hmdp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "123456"]
    ports:
      - "6381:6379"
    volumes:
      - hmdp_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a 123456 ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-init:
    image: redis:7-alpine
    depends_on:
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - redis-cli -h redis -a 123456 XGROUP CREATE stream.orders g1 0 MKSTREAM || true

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: hmdp
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: 123456
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"

  frontend:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./frontend-public:/usr/share/nginx/html:ro
      - ./docker/nginx.default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  hmdp_mysql_data:
  hmdp_redis_data:
