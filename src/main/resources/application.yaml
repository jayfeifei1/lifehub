server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3308}/${MYSQL_DB:hmdp}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6380}
    password: ${REDIS_PASSWORD:123456}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: lifehub-transaction-producer
    send-message-timeout: 5000
    retry-times-when-send-failed: 2
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
# 业务自定义配置
hmdp:
  # 图片上传根目录（容器部署通过 UPLOAD_DIR 环境变量覆盖）
  upload-dir: "${UPLOAD_DIR:D:/BaiduNetdiskDownload/redis/nginx-1.18.0/html/hmdp/imgs}"
  seckill:
    # rocketmq（默认）或 redis-stream（回退）；两者不会双投
    queue-mode: ${SECKILL_QUEUE_MODE:rocketmq}
  cache:
    # rocketmq（默认）或 redis-list（回退）
    invalidation-mode: ${CACHE_INVALIDATION_MODE:rocketmq}
  rocketmq:
    topic:
      seckill-order: lifehub-seckill-order-tx
      seckill-dlq: lifehub-seckill-order-dlq
      shop-update: lifehub-shop-update-tx
      shop-cache-delay: lifehub-shop-cache-delay
logging:
  level:
    com.hmdp: debug
